<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка безопасности</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            position: relative;
        }
        
        .logo {
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .logo p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .widget-container {
            margin: 30px 0;
            display: flex;
            justify-content: center;
        }
        
        .loading {
            color: #666;
            font-size: 16px;
            margin: 20px 0;
        }
        
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
            font-size: 12px;
            color: #666;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .debug-info h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }
        
        .debug-toggle {
            margin-top: 15px;
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 12px;
        }
        
        /* Стиль для модального окна перенаправления */
        .redirect-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .redirect-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .redirect-content h2 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .redirect-content p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .redirect-timer {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        
        .close-message {
            margin-top: 20px;
            padding: 15px;
            background: #e8f4ff;
            border-radius: 10px;
            color: #0066cc;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🔒 Проверка безопасности</h1>
            <p>Пожалуйста, подтвердите, что вы человек, чтобы продолжить</p>
        </div>
        
        <div class="widget-container">
            <!-- Виджет Cloudflare Turnstile -->
            <div class="cf-turnstile" 
                 data-sitekey="0x4AAAAAACTpGWvnnCRoq2HM"
                 data-callback="onSuccess"
                 data-error-callback="onError"
                 data-expired-callback="onExpired"
                 data-theme="light"
                 data-size="normal">
            </div>
        </div>
        
        <div class="loading" id="loadingText">
            Загрузка проверки...
        </div>
        
        <div class="status" id="statusMessage"></div>
        
        <div class="close-message" id="closeMessage">
            ✅ Проверка успешно пройдена! Вы можете закрыть эту страницу.
        </div>
        
        <div class="debug-info" id="debugInfo">
            <h3>Отладочная информация:</h3>
            <div id="debugContent"></div>
        </div>
        
        <button class="debug-toggle" onclick="toggleDebug()">Показать отладку</button>
    </div>
    
    <!-- Модальное окно для перенаправления -->
    <div class="redirect-modal" id="redirectModal">
        <div class="redirect-content">
            <h2>✅ Проверка пройдена!</h2>
            <p id="redirectText">Вы будете перенаправлены на бота...</p>
            <div class="redirect-timer" id="redirectTimer">3</div>
            <button onclick="proceedImmediately()" style="
                background: #667eea;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
            ">Перейти сейчас</button>
        </div>
    </div>

    <!-- Cloudflare Turnstile скрипт -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    
    <script>
        // ========== КОНСТАНТА ДЛЯ ДАННЫХ ОТ БОТА ==========
        let botParameters = null;
        
        // Базовый домен для перенаправления
        const BASE_TARGET_SITE = "https://t.me/random_fatherbot";
        
        // Флаг для определения, открыто ли в Telegram WebApp
        let isTelegramWebApp = false;
        
        // Таймер для перенаправления
        let redirectTimer = 3;
        let timerInterval;
        
        // ========== ОБРАБОТКА TELEGRAM MINI APP ==========
        function initTelegramWebApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                isTelegramWebApp = true;
                console.log("📱 Запущено как Telegram Mini App");
                
                Telegram.WebApp.ready();
                
                // Получаем данные от бота
                const initData = Telegram.WebApp.initData || '';
                const initDataUnsafe = Telegram.WebApp.initDataUnsafe || {};
                
                // ЗАПИСЫВАЕМ в константу botParameters (ТОЛЬКО ЗАПИСЫВАЕМ!)
                botParameters = {
                    initData: initData,
                    initDataUnsafe: initDataUnsafe,
                    startParam: Telegram.WebApp.initDataUnsafe.start_param || null,
                    user: Telegram.WebApp.initDataUnsafe.user || null,
                    queryId: Telegram.WebApp.initDataUnsafe.query_id || null,
                    urlParams: getUrlParams()
                };
                
                console.log("🤖 Данные от бота ЗАПИСАНЫ:", botParameters);
                updateDebugInfo("Telegram WebApp обнаружен. Данные бота ЗАПИСАНЫ в botParameters.");
                
                // Развертываем на весь экран
                Telegram.WebApp.expand();
                
                return true;
            }
            return false;
        }
        
        // ========== ПОЛУЧЕНИЕ ПАРАМЕТРОВ ИЗ URL ==========
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const result = {};
            
            for (const [key, value] of params.entries()) {
                result[key] = value;
            }
            
            return result;
        }
        
        // ========== ПОЛУЧЕНИЕ ПАРАМЕТРА ИЗ URL ==========
        function getStartParamFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const param = params.get('param');
            
            if (param) {
                console.log("📥 Параметр из URL:", param);
                updateDebugInfo(`Параметр из URL: ${param}`);
                return param;
            }
            
            // Если параметра нет, проверяем startParam из Telegram
            if (botParameters && botParameters.startParam) {
                console.log("📥 Параметр из startParam:", botParameters.startParam);
                updateDebugInfo(`Параметр из startParam: ${botParameters.startParam}`);
                return botParameters.startParam;
            }
            
            // Если ничего нет, используем пустую строку
            console.log("📥 Параметр не найден, используем пустую строку");
            updateDebugInfo("Параметр не найден, используем пустую строку");
            return "";
        }
        
        // ========== ФОРМИРОВАНИЕ КОНЕЧНОГО URL ==========
        function getFinalRedirectUrl() {
            const startParam = getStartParamFromUrl();
            
            // Формируем финальный URL
            let finalUrl = BASE_TARGET_SITE;
            if (startParam) {
                finalUrl = `${BASE_TARGET_SITE}?start=${encodeURIComponent(startParam)}`;
            } else {
                finalUrl = BASE_TARGET_SITE; // Без параметра start
            }
            
            console.log("🔗 Финальный URL для редиректа:", finalUrl);
            updateDebugInfo(`Финальный URL: ${finalUrl}`);
            
            return finalUrl;
        }
        
        // ========== ОБРАБОТКА УСПЕШНОЙ ПРОВЕРКИ ==========
        function onSuccess(token) {
            console.log("✅ Проверка пройдена! Токен:", token);
            console.log("📦 Данные от бота (только записаны):", botParameters);
            
            // Показываем статус успеха
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = "✓ Проверка пройдена успешно!";
            statusEl.className = "status success";
            statusEl.style.display = 'block';
            
            // Скрываем текст загрузки
            document.getElementById('loadingText').style.display = 'none';
            
            // Показываем модальное окно перенаправления
            showRedirectModal();
        }
        
        // ========== ПОКАЗ МОДАЛЬНОГО ОКНА ПЕРЕНАПРАВЛЕНИЯ ==========
        function showRedirectModal() {
            const modal = document.getElementById('redirectModal');
            const redirectText = document.getElementById('redirectText');
            
            // Устанавливаем текст в зависимости от контекста
            const finalUrl = getFinalRedirectUrl();
            if (isTelegramWebApp) {
                redirectText.textContent = "Вы будете перенаправлены на бота, затем Mini App закроется...";
            } else {
                redirectText.textContent = "Вы будете перенаправлены на бота...";
            }
            
            modal.style.display = 'flex';
            
            // Запускаем таймер
            redirectTimer = 3;
            document.getElementById('redirectTimer').textContent = redirectTimer;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                redirectTimer--;
                document.getElementById('redirectTimer').textContent = redirectTimer;
                
                if (redirectTimer <= 0) {
                    clearInterval(timerInterval);
                    proceedWithRedirect();
                }
            }, 1000);
        }
        
        // ========== ПРОЦЕСС ПЕРЕНАПРАВЛЕНИЯ ==========
        function proceedWithRedirect() {
            const modal = document.getElementById('redirectModal');
            modal.style.display = 'none';
            
            // Получаем финальный URL
            const finalUrl = getFinalRedirectUrl();
            updateDebugInfo(`🔄 Перенаправление на: ${finalUrl}`);
            
            // Перенаправляем на финальный URL
            window.location.href = finalUrl;
            
            // Если открыто в Telegram Mini App, закрываем его после перенаправления
            if (isTelegramWebApp) {
                // Ждем 1 секунду, чтобы бот начал загружаться, потом закрываем
                setTimeout(() => {
                    try {
                        Telegram.WebApp.close();
                        console.log("✅ Mini App закрыт после перенаправления");
                    } catch (e) {
                        console.log("⚠️ Не удалось закрыть Mini App, возможно пользователь уже ушел");
                    }
                }, 1000);
            }
            
            // Показываем сообщение о том, что можно закрыть страницу
            setTimeout(() => {
                document.getElementById('closeMessage').style.display = 'block';
            }, 2000);
        }
        
        // ========== НЕМЕДЛЕННОЕ ПЕРЕНАПРАВЛЕНИЕ ==========
        function proceedImmediately() {
            clearInterval(timerInterval);
            proceedWithRedirect();
        }
        
        // ========== ОБРАБОТКА ОШИБОК ==========
        function onError() {
            console.error("❌ Ошибка при проверке");
            
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = "✗ Произошла ошибка при проверке. Пожалуйста, обновите страницу и попробуйте снова.";
            statusEl.className = "status error";
            statusEl.style.display = 'block';
            
            document.getElementById('loadingText').style.display = 'none';
            updateDebugInfo("Ошибка проверки Cloudflare Turnstile");
        }
        
        function onExpired() {
            console.warn("⚠️ Токен истек");
            
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = "Время проверки истекло. Пожалуйста, выполните проверку снова.";
            statusEl.className = "status error";
            statusEl.style.display = 'block';
            
            updateDebugInfo("Токен проверки истек");
        }
        
        // ========== ОТЛАДОЧНАЯ ИНФОРМАЦИЯ ==========
        function updateDebugInfo(message) {
            const debugContent = document.getElementById('debugContent');
            const timestamp = new Date().toLocaleTimeString();
            debugContent.innerHTML += `<div><strong>[${timestamp}]</strong> ${message}</div>`;
        }
        
        function toggleDebug() {
            const debugInfo = document.getElementById('debugInfo');
            debugInfo.style.display = debugInfo.style.display === 'block' ? 'none' : 'block';
        }
        
        // ========== ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ ==========
        document.addEventListener('DOMContentLoaded', function() {
            // Проверяем Telegram WebApp
            if (!initTelegramWebApp()) {
                updateDebugInfo("Запущено как обычная веб-страница");
            }
            
            // Отслеживаем загрузку виджета
            let widgetLoaded = false;
            
            function checkWidgetLoaded() {
                const widget = document.querySelector('.cf-turnstile iframe');
                if (widget && !widgetLoaded) {
                    widgetLoaded = true;
                    document.getElementById('loadingText').textContent = "Проверка загружена. Пройдите проверку...";
                    updateDebugInfo("Виджет Cloudflare загружен");
                }
            }
            
            setInterval(checkWidgetLoaded, 500);
            
            // Добавляем информацию о botParameters в отладку
            if (botParameters) {
                updateDebugInfo("Bot Parameters: " + JSON.stringify(botParameters, null, 2));
            }
        });
    </script>
</body>
    </html>
